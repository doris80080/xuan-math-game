/* ===== 瑄的 App 動畫與獎勵 ===== */
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}

.encourage{font-weight:900;color:#b44f78;font-size:19px;line-height:1.45;margin:10px 0}

<div class="gameTopArt"><div class="top"><button class="back" id="back">← 回首頁</button><div class="title" id="gameTitle">數學遊戲</div><button class="mini" id="score">⭐ 0</button></div><div class="gameWelcome"><span class="penguin">🐧</span><span>瑄，我們一起想想看！</span><span>⭐</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="questionCard" id="questionCard"><div class="miniMascot">🐧💗</div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div id="encourage" class="encourage" style="display:none"></div><div id="encourageSmall" class="encourageSmall" style="display:none"></div><div class="actions"><button class="btn" id="hint">💡 提示</button><button class="btn" id="speak">🔊 聽題目</button><button class="btn primary" id="next">下一題</button></div></div>
<div class="reward" id="reward"><div class="rewardBox"><div class="rewardMascot">🐧💗</div><div class="rewardTitle">🎉 瑄完成今天的 5 題啦！</div><div class="rewardStars">⭐⭐⭐⭐⭐</div><div class="rewardText">太棒了！今天的數學小任務完成！<br>現在選一個小獎勵吧～🎁</div><div id="rewardArea" style="display:none"></div><div class="rewardChoices"><button class="rewardChoice" id="danceBtn">🐧<br>看小企鵝跳舞</button><button class="rewardChoice alt" id="stickerBtn">🎁<br>獲得一張貼紙</button></div><button class="celebrateBtn" id="rewardDone" style="display:none">完成～回首頁 🏠</button></div></div>
</div></div>
<script>
const G={
add:{title:"🐰 動物加加樂",make(){let a=r(1,3),b=r(1,3),c=r(0,2),ans=a+b+c;return{q:`瑄有 ${a} 隻小兔子，媽媽有 ${b} 隻企鵝，阿嬤有 ${c} 隻小貓，全部有幾隻？`,ans,h:`先算 ${a}+${b}，再把 ${c} 加進來。`}}},
compare:{title:"🐧 誰比較多？",make(){let a=r(1,6),b=r(1,6);while(a===b)b=r(1,6);let ans=a>b?"瑄":"媽媽";return{q:`瑄有 ${a} 顆糖果，媽媽有 ${b} 顆，誰比較多？`,ans,opts:["瑄","媽媽"],h:"看看哪一邊的數字比較大。"}}},
sub:{title:"🥕 小兔子跑掉了",make(){let a=r(3,7),b=r(1,a-1);return{q:`草地上有 ${a} 隻兔子，${b} 隻跑走了，還剩幾隻？`,ans:a-b,h:`想想看：${a} 減掉 ${b}。`}}},
mystery:{title:"🔮 神秘數字",make(){let a=r(1,6),b=r(1,3);return{q:`我心裡有一個數字，加上 ${b} 會變成 ${a+b}，原來是多少？`,ans:a,h:"可以從答案往回數喔！"}}},
sequence:{title:"🔢 數字接龍",make(){let a=r(1,4),step=r(1,2);return{q:`數字接龍：${a}、${a+step}、${a+2*step}、？`,ans:a+3*step,h:`每次都增加 ${step}。`}}},
wrong:{title:"😝 媽媽說錯了！",make(){let a=r(1,4),b=r(1,3),correct=a+b,wrong=correct+(Math.random()<.5?-1:1);return{q:`媽媽說：${a} + ${b} = ${wrong}。媽媽說對嗎？`,ans:wrong===correct?"對":"錯",opts:["對","錯"],h:`其實 ${a}+${b} 是 ${correct} 喔！`}}},
classify:{title:"🧸 分類小高手",make(){let sets=[["蘋果","香蕉","草莓","小兔子"],["汽車","公車","火車","蘋果"],["紅色","黃色","藍色","小熊"]];let s=sets[r(0,sets.length-1)],ans=s[3];return{q:`哪一個跟其他三個不一樣？`,ans,opts:s,h:"看看三個是不是同一類的東西。"}}},
order:{title:"📏 排排隊",make(){let a=r(1,3),b=r(a+1,6);return{q:`小熊有 ${a} 顆球，小兔有 ${b} 顆球。誰比較多？`,ans:"小兔",opts:["小熊","小兔"],h:"比較兩個數字，哪個比較大？"}}},
shape:{title:"🔺 形狀偵探",make(){let opts=["圓形","三角形","正方形"],ans=opts[r(0,2)];return{q:`${ans} 有幾個角？`,ans:ans==="圓形"?0:ans==="三角形"?3:4,opts:[0,3,4],h:"數一數形狀的角角。"}}},
position:{title:"🐧 位置小偵探",make(){let opts=["上面","下面","旁邊"],ans=opts[r(0,2)];return{q:`小企鵝站在小兔子的 ${ans}。請問小企鵝在哪裡？`,ans,opts,h:"仔細聽媽媽說的是哪一個位置。"}}},
pattern:{title:"🌈 規律接龍",make(){let a=r(1,3),b=a+1;return{q:`看規律：${a}、${b}、${a}、${b}、？`,ans:a,opts:[a,b,a+2],h:"兩個數字一直輪流出現。"}}},
share:{title:"🍓 公平分一分",make(){let people=r(2,3),each=r(1,3),total=people*each;return{q:`有 ${total} 顆草莓，平均分給 ${people} 個小朋友，每人幾顆？`,ans:each,h:`想一想：${each} 顆 × ${people} 個小朋友 = ${total} 顆。`}}},
count:{title:"🔢 數一數",make(){let n=r(2,7),items=["🐰","⭐","🍎","🐧","🧸"],item=items[r(0,items.length-1)];return{q:`請數一數：${item.repeat(n)} 一共有幾個？`,ans:n,h:"慢慢一個一個數，不要急。"}}},
neighbor:{title:"🏠 數字鄰居",make(){let n=r(2,5),which=Math.random()<.5?"前面":"後面",ans=which==="前面"?n-1:n+1;return{q:`數字 ${n} 的${which}一個數字是？`,ans,h:`從 ${n} 往${which}數一格。`}}},
oneMore:{title:"➕ 多一個少一個",make(){let n=r(1,6),more=Math.random()<.5,ans=more?n+1:n-1;return{q:`現在有 ${n} 顆星星，${more?"多 1 顆":"少 1 顆"}，變成幾顆？`,ans,h:more?`從 ${n} 再數 1 個。`:`從 ${n} 往回數 1 個。`}}},
long:{title:"📐 誰比較長？",make(){let opts=["鉛筆","橡皮擦","尺"],ans=opts[r(0,2)];let hint=ans==="尺"?"尺通常比另外兩個長。":"想像把三樣東西排在一起比較長度。";return{q:`媽媽說：${ans} 通常比較長。你覺得對嗎？`,ans:"對",opts:["對","不對"],h:hint}}},
match:{title:"🧩 找一樣的",make(){let pairs=[["🐰","🐰","🐧"],["⭐","🍎","⭐"],["🧸","🧸","🍓"],["🐶","🐱","🐶"]],p=pairs[r(0,pairs.length-1)];return{q:`哪一個圖案跟第一個 ${p[0]} 一樣？`,ans:p[0],opts:[p[1],p[2]],h:"看清楚圖案的樣子。"}}},
odd:{title:"👀 找出不一樣",make(){let sets=[["🍎","🍎","🍎","🍌"],["🐰","🐰","🐱","🐰"],["⭐","🌟","⭐","⭐"],["🟢","🟢","🔵","🟢"]];let s=sets[r(0,sets.length-1)],ans=s[2];return{q:`找一找：${s.join(" ")}，哪一個不一樣？`,ans,opts:[...new Set(s)],h:"慢慢看每一個，找出偷偷變掉的那個。"}}}
};function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}const today=new Date().toISOString().slice(0,10);let state=JSON.parse(localStorage.getItem("xuanMathOfficial")||"null");if(!state||state.date!==today)state={date:today,done:0,stars:0};let type="add",cur=null,answered=false;const $=id=>document.getElementById(id);
function save(){localStorage.setItem("xuanMathOfficial",JSON.stringify(state))}function updateHome(){$("homeStars").textContent=state.stars+" ⭐";$("homeDone").textContent=state.done+" / 5 題"}function opts(ans,custom){if(custom)return [...new Set(custom)];if(typeof ans!=="number")return[ans];let s=new Set([ans]);while(s.size<4)s.add(Math.max(0,ans+r(-2,2)));return[...s].sort((a,b)=>a-b)}
function openGame(t){type=t;answered=false;$("home").style.display="none";$("gameScreen").style.display="block";$("reward").classList.remove("show");$("questionCard").style.display="block";newQ()}
function newQ(){answered=false;$("feedback").textContent="";cur=G[type].make();$("gameTitle").textContent=G[type].title;$("question").textContent=cur.q;$("answers").innerHTML="";opts(cur.ans,cur.opts).forEach(v=>{let b=document.createElement("button");b.className="ans";b.textContent=v;b.onclick=()=>check(v,b);$("answers").appendChild(b)});$("score").textContent="⭐ "+state.stars;$("bar").style.width=Math.min(100,state.done/5*100)+"%"}
function check(v,b){if(answered)return;let ok=String(v)===String(cur.ans);if(ok){answered=true;state.done++;state.stars++;b.classList.add("ok");$("feedback").textContent="答對了！⭐ 瑄好棒！";save();$("score").textContent="⭐ "+state.stars;$("bar").style.width=Math.min(100,state.done/5*100)+"%";updateHome();if(typeof showCheer==="function")showCheer(true);if(!dailyMode && state.done>=5)setTimeout(()=>{$("questionCard").style.display="none";$("reward").classList.add("show")},450)}else{$("feedback").textContent="再想一下～💗 按提示看看";b.classList.add("no");if(typeof showCheer==="function")showCheer(false)}}
$("hint").onclick=()=>{$("feedback").textContent="💡 "+cur.h};$("speak").onclick=()=>{if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance(cur.q);u.lang="zh-TW";speechSynthesis.cancel();speechSynthesis.speak(u)}};$("back").onclick=()=>{dailyMode=false;$("gameScreen").style.display="none";$("home").style.display="block";updateHome()};$("rewardBack").onclick=()=>{dailyMode=false;$("reward").classList.remove("show");$("questionCard").style.display="block";$("gameScreen").style.display="none";$("home").style.display="block";updateHome()};let dailyQueue=[],dailyIndex=0,dailyMode=false;
function startDaily(){dailyMode=true;dailyIndex=0;dailyQueue=[...Object.keys(G)].sort(()=>Math.random()-.5).slice(0,5);openGame(dailyQueue[0]);}
const oldNewQ=newQ;
newQ=function(){oldNewQ();};
$("dailyBtn").onclick=startDaily;
$("next").onclick=()=>{
  if(!answered){$("feedback").textContent="先選一個答案喔～💗";return}
  if(dailyMode){
    dailyIndex++;
    if(dailyIndex<dailyQueue.length){type=dailyQueue[dailyIndex];newQ();return}
    dailyMode=false;$("questionCard").style.display="none";$("reward").classList.add("show");return;
  }
  newQ();
};
document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{dailyMode=false;openGame(b.dataset.game)});
updateHome();
</script>
<script>
/* ===== 瑄的互動回饋 ===== */
const cheerLines = [
  ["沒關係～再想一下，瑄一定可以的！💗","小小偵探慢慢找答案就好～"],
  ["答錯也沒關係！我們一起想想看 🐧","數學就是要試試看，不用怕錯！"],
  ["差一點點！瑄再看一次題目～🌷","媽媽陪妳一起想！"],
  ["沒問題～下一題繼續挑戰！⭐","錯一次不代表不會，瑄正在學習喔！"]
];
const winLines = [
  ["答對了！瑄好厲害！⭐","這顆星星是瑄自己努力拿到的！"],
  ["耶～～答對！🎉","媽媽幫瑄記一顆星星！"],
  ["太棒啦！✨","瑄剛剛有認真想耶！"],
  ["答對！小企鵝都在替瑄鼓掌！🐧👏","再來一題！"]
];

function showStars(){
  const layer=document.getElementById("fxLayer");
  if(!layer)return;
  for(let i=0;i<9;i++){
    const s=document.createElement("div");
    s.className="starPop";s.textContent=i%3===0?"🌟":"⭐";
    s.style.left=(20+Math.random()*60)+"%";
    s.style.top=(35+Math.random()*25)+"%";
    s.style.setProperty("--dx",(Math.random()*180-90)+"px");
    s.style.setProperty("--dy",(-100-Math.random()*170)+"px");
    s.style.animationDelay=(Math.random()*180)+"ms";
    layer.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}

function showCheer(ok){
  const a=ok?winLines[Math.floor(Math.random()*winLines.length)]:cheerLines[Math.floor(Math.random()*cheerLines.length)];
  const e=document.getElementById("encourage"), es=document.getElementById("encourageSmall");
  if(e){e.textContent=a[0];e.style.display="block";e.classList.remove("correctBounce");void e.offsetWidth;if(ok)e.classList.add("correctBounce")}
  if(es){es.textContent=a[1];es.style.display="block"}
  if(ok)showStars();
}

function makeRewardStars(){
  const n=Math.min(5, Number(localStorage.getItem("xuanStars")||0));
  return "⭐".repeat(n)+"☆".repeat(5-n);
}

function showDance(){
  const area=document.getElementById("rewardArea");
  area.style.display="block";
  area.innerHTML='<div class="danceStage"><span class="dancePenguin">🐧</span><span class="dancePenguin">🐧</span><span class="dancePenguin">🐧</span></div><div class="encourage">小企鵝舞蹈時間！💃🕺</div><div class="encourageSmall">咚咚咚～恭喜瑄完成今天的 5 題！</div>';
  document.getElementById("rewardDone").style.display="inline-block";
  document.getElementById("danceBtn").style.display="none";
  document.getElementById("stickerBtn").style.display="none";
  showStars();
}

function showSticker(){
  const stickers=["🌸","🦄","🌈","🍓","🐧","⭐","🎀","🦋","🍭","🧸"];
  const chosen=stickers[Math.floor(Math.random()*stickers.length)];
  const area=document.getElementById("rewardArea");
  area.style.display="block";
  area.innerHTML='<div class="stickerWall">'+chosen+'<span class="sticker">'+chosen+'</span><span class="sticker">'+chosen+'</span></div><div class="encourage">瑄獲得今日貼紙！🎁</div><div class="encourageSmall">把它收藏起來，明天再來拿一張！</div>';
  document.getElementById("rewardDone").style.display="inline-block";
  document.getElementById("danceBtn").style.display="none";
  document.getElementById("stickerBtn").style.display="none";
  showStars();
}

document.addEventListener("click",(ev)=>{
  const b=ev.target.closest("button");
  if(!b)return;
  /* 若原程式已有 answered 與 current answer 邏輯，利用 feedback 文字判斷結果並給動畫。
     這裡不攔截按鈕，只在短暫延遲後讀取畫面狀態。 */
  if(b.id==="check" || b.id==="submit" || b.classList.contains("answerBtn")){
    setTimeout(()=>{
      const f=document.getElementById("feedback");
      if(!f)return;
      const text=(f.textContent||"");
      const ok=/答對|正確|太棒|恭喜/.test(text);
      showCheer(ok);
    },80);
  }
});

document.getElementById("danceBtn")?.addEventListener("click",showDance);
document.getElementById("stickerBtn")?.addEventListener("click",showSticker);
document.getElementById("rewardDone")?.addEventListener("click",()=>{
  document.getElementById("reward").classList.remove("show");
  document.getElementById("rewardArea").style.display="none";
  document.getElementById("rewardDone").style.display="none";
  document.getElementById("danceBtn").style.display="";
  document.getElementById("stickerBtn").style.display="";
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("home").style.display="block";
  if(typeof updateHome==="function")updateHome();
});

/* 每次開啟遊戲時，清掉上一題的鼓勵文字 */
const oldOpenGame = window.openGame;
if(typeof oldOpenGame==="function"){
  window.openGame=function(...args){
    const e=document.getElementById("encourage"), es=document.getElementById("encourageSmall");
    if(e)e.style.display="none"; if(es)es.style.display="none";
    return oldOpenGame.apply(this,args);
  };
}
</script>

</body></html>
