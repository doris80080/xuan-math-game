<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffd9e7">
<title>企鵝妹的數學遊戲｜V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#f8dce8;color:#70432c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}button{font:inherit;border:0;cursor:pointer}.app{width:100%;max-width:440px;margin:auto;min-height:100vh;background:linear-gradient(#fff5f9,#f8eaff)}
.topHero{position:relative;height:220px;background:#ffdce8;overflow:hidden;border-radius:0 0 30px 30px;box-shadow:0 7px 20px #a96f8c24}.heroImg{position:absolute;inset:0;background:url('xuan-home-clean.webp') center 13%/100% auto no-repeat;transform:scale(1.08)}.heroShade{position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,#ffdce8)}.heroBack{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;background:#ffffffd9;color:#9d5075;font-size:22px;font-weight:900;box-shadow:0 4px 12px #7d4f6422}.heroTitle{position:absolute;left:70px;right:70px;bottom:17px;text-align:center;background:#fff7fae8;border:3px solid #fff;border-radius:18px;padding:8px 10px;color:#b84e7b;font-size:20px;font-weight:1000;box-shadow:0 4px 12px #7d4f6420}.heroTitle small{display:block;color:#8e667a;font-size:11px;margin-top:2px}
.progressWrap{padding:12px 14px 4px}.progressBox{background:#fff;border:2px solid #f2cfe0;border-radius:22px;padding:10px 12px;box-shadow:0 5px 16px #8e628d1b}.progressTop{display:flex;justify-content:space-between;align-items:center;font-weight:1000;color:#8c4e70}.progress{height:11px;background:#f3e5ed;border-radius:99px;overflow:hidden;margin-top:7px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff82ad,#d19af3);transition:.3s}
.questionArea{padding:10px 14px 100px}.scene{background:#fffafc;border:4px solid #fff;border-radius:30px;padding:14px;box-shadow:0 10px 26px #865c7820;overflow:hidden}.sceneTop{min-height:125px;border-radius:22px;background:linear-gradient(135deg,#ffe7f0,#e9f7ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.bubble{position:absolute;border-radius:50%;background:#fff7;filter:blur(.2px)}.b1{width:80px;height:80px;left:-15px;top:-25px}.b2{width:60px;height:60px;right:-5px;bottom:-20px}.sceneEmoji{font-size:58px;letter-spacing:8px;z-index:1;filter:drop-shadow(0 4px 5px #76506a25)}.speech{margin:10px 4px 3px;text-align:center;color:#a24d75;font-size:15px;font-weight:1000}.question{font-size:25px;line-height:1.45;font-weight:1000;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;padding:6px 4px;color:#6d452e}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.ans{min-height:64px;border-radius:20px;background:linear-gradient(#fff,#fff0f6);border:3px solid #f5d6e5;color:#7a4d67;font-size:23px;font-weight:1000;box-shadow:0 5px 12px #805a7418}.ans:active{transform:scale(.97)}.ans.ok{background:#e7faef;border-color:#8bd6a8}.ans.no{background:#fff0f0;border-color:#efaaaa;animation:shake .25s}.feedback{text-align:center;min-height:52px;padding:9px 4px 0;font-weight:1000;color:#b44f78;font-size:18px}.feedback small{display:block;color:#916d80;font-size:13px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}.btn{border-radius:17px;padding:12px 5px;background:#f0e3f8;color:#684c70;font-weight:1000}.primary{background:linear-gradient(135deg,#ff82ad,#c99bed);color:#fff}.backHome{display:block;width:100%;margin-top:12px;background:#fff;border:2px solid #efd4e1;color:#9a5b7b;border-radius:17px;padding:12px;font-weight:1000}
.games{padding:0 14px 110px}.sectionTitle{text-align:center;color:#b84e7b;font-size:21px;font-weight:1000;margin:4px 0 5px}.sectionHint{text-align:center;color:#967185;font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gameCard{min-height:105px;border-radius:23px;padding:11px 8px;background:#fff;border:3px solid #fff;box-shadow:0 5px 14px #8e628d18;color:#754b64;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.gameCard .pic{font-size:34px}.gameCard b{font-size:15px}.gameCard span{font-size:11px;color:#98768a}.c1{background:#fff1d6}.c2{background:#e8f7ff}.c3{background:#eafae9}.c4{background:#eee8ff}.c5{background:#ffe9f3}.c6{background:#fff0dc}.c7{background:#fff0df}.c8{background:#e8f5ff}.c9{background:#f2eaff}.c10{background:#e7fbf7}.c11{background:#fff4cf}.c12{background:#ffe9f3}.c13{background:#e7f7ff}.c14{background:#eeeaff}.c15{background:#e9f9e8}.c16{background:#fff0dc}.c17{background:#f7e8ff}.c18{background:#e6f8f4}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(440px,100%);height:72px;background:#fffafc;border-top:2px solid #f2d4e2;display:grid;grid-template-columns:repeat(4,1fr);z-index:30;box-shadow:0 -5px 18px #8e628d18;padding-bottom:env(safe-area-inset-bottom)}.nav{background:transparent;color:#9a7287;font-size:11px;font-weight:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav .ico{font-size:24px}.nav.active{color:#d34f83}.modal{display:none;position:fixed;inset:0;background:#5d415b66;z-index:50;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalBox{width:min(440px,100%);max-height:82vh;overflow:auto;background:#fff8fc;border-radius:30px 30px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #4d334a33}.modalHead{display:flex;justify-content:space-between;align-items:center;color:#bd4e7c;font-size:21px;font-weight:1000}.close{width:38px;height:38px;border-radius:50%;background:#f1e4ed;color:#76536c;font-size:22px}.line{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:2px dashed #f0cada;font-weight:900}.tiny{color:#977486;font-size:12px;text-align:center;line-height:1.6}.reward{display:none;position:fixed;inset:0;background:#fff2f8f2;z-index:60;align-items:center;justify-content:center;padding:20px}.reward.show{display:flex}.rewardBox{width:min(390px,100%);background:#fff;border:4px solid #ffd5e5;border-radius:30px;padding:22px;text-align:center;box-shadow:0 18px 50px #70486130}.dance{font-size:64px;animation:dance .55s infinite alternate ease-in-out}.dance:nth-child(2){animation-delay:.15s}.dance:nth-child(3){animation-delay:.3s}@keyframes dance{from{transform:translateY(7px) rotate(-7deg)}to{transform:translateY(-8px) rotate(7deg)}}@keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}.starsFx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}.fly{position:absolute;font-size:30px;animation:fly .9s ease-out forwards}@keyframes fly{0%{opacity:0;transform:scale(.3) translate(0,0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) translate(var(--x),var(--y))}}
.hidden{display:none!important}

/* ===== V2 主視覺滿版：18張情境插畫熱區 ===== */
.homeVisual{position:relative;width:100%;aspect-ratio:1024/1536;background:#ffdce8;overflow:hidden;touch-action:manipulation}
.homeImage{position:absolute;inset:0;background-position:center top;background-repeat:no-repeat;background-size:100% 100%}
.hotspotGrid{position:absolute;left:2.5%;right:2.5%;top:34.0%;height:57.2%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:1.0% 1.1%;padding:0;z-index:5}
.hot{border:0;background:transparent;border-radius:16px;min-width:0;min-height:0}
.hot:active{background:rgba(255,255,255,.18);transform:scale(.98)}
.dynamicStats{position:absolute;left:2.5%;top:19.0%;width:23%;z-index:8;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.dynamicStars,.dynamicDone{background:rgba(255,248,252,.96);border:2px solid #fff;border-radius:16px;padding:5px 7px;text-align:center;box-shadow:0 4px 12px rgba(120,65,90,.15);color:#75451f;font-weight:1000;line-height:1.05}
.dynamicStars small,.dynamicDone small{display:block;font-size:9px;color:#c84f80}.dynamicStars strong,.dynamicDone strong{font-size:18px}.dynamicDone span{display:block;font-size:10px;color:#a1aec4;letter-spacing:1px;margin-top:2px}
.navHot{position:absolute;bottom:1.1%;height:6.2%;z-index:9;background:transparent;border:0;border-radius:25px}.nHome{left:8%;width:21%}.nStars{left:30%;width:21%}.nRecords{left:52%;width:21%}.nSettings{left:74%;width:21%}.navHot:active{background:rgba(255,255,255,.2)}
.dailyHot{position:absolute;left:34%;top:28.5%;width:32%;height:4.3%;z-index:7;background:transparent;border:0;border-radius:20px}
.gameTop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:12px 12px 4px;background:#fff5f9;position:sticky;top:0;z-index:4}.backTop{border:0;border-radius:15px;background:#fff;padding:10px 11px;color:#9d5075;font-weight:1000;box-shadow:0 4px 12px #7d4f6422}.gameTitle{text-align:center;font-weight:1000;color:#b84e7b;font-size:18px}.gameScore{background:#fff0b9;border-radius:15px;padding:9px 10px;font-weight:1000;color:#8a4b16}.questionArea{min-height:100vh;background:linear-gradient(#fff5f9,#f8eaff);padding-bottom:30px}
@media (min-width:441px){body{background:#f8dce8}.homeVisual{border-radius:0 0 26px 26px}.app{box-shadow:0 0 30px rgba(120,65,90,.12)}}
</style>

<script>
const G={
add:{t:'🐰 動物加加樂',e:'🐰🐰🐧',q(){let a=r(1,3),b=r(1,3),c=r(0,2);return{q:`瑄有 ${a} 隻小兔子，媽媽有 ${b} 隻企鵝，阿嬤有 ${c} 隻小貓，全部有幾隻？`,a:a+b+c,h:`先算 ${a}+${b}，再把 ${c} 加進來。`}}},
compare:{t:'🍓 誰比較多？',e:'🍓🍓🐰',q(){let a=r(1,6),b=r(1,6);while(a===b)b=r(1,6);return{q:`瑄有 ${a} 顆草莓，媽媽有 ${b} 顆，誰比較多？`,a:a>b?'瑄':'媽媽',o:['瑄','媽媽'],h:'看看哪一邊的數字比較大。'}}},
sub:{t:'🐰 小兔子跑掉了',e:'🐰🐰🌿',q(){let a=r(3,7),b=r(1,a-1);return{q:`草地上有 ${a} 隻兔子，${b} 隻跑走了，還剩幾隻？`,a:a-b,h:`想想看：${a} 減掉 ${b}。`}}},
mystery:{t:'🔮 神秘數字',e:'🔮❓⭐',q(){let a=r(1,6),b=r(1,3);return{q:`我心裡有一個數字，加上 ${b} 會變成 ${a+b}，原來是多少？`,a,h:'可以從答案往回數喔！'}}},
sequence:{t:'🚂 數字接龍',e:'🚂🔢⭐',q(){let a=r(1,4),s=r(1,2);return{q:`數字接龍：${a}、${a+s}、${a+2*s}、？`,a:a+3*s,h:`每次都增加 ${s}。`}}},
wrong:{t:'🐧 媽媽說錯了！',e:'👩🐧❓',q(){let a=r(1,4),b=r(1,3),c=a+b,w=c+(Math.random()<.5?-1:1);return{q:`媽媽說：${a} + ${b} = ${w}。媽媽說對嗎？`,a:w===c?'對':'錯',o:['對','錯'],h:`其實 ${a}+${b} 是 ${c} 喔！`}}},
classify:{t:'🧸 分類小高手',e:'🧸🍎🐰',q(){let s=[['蘋果','香蕉','草莓','小兔子'],['汽車','公車','火車','蘋果'],['紅色','黃色','藍色','小熊']][r(0,2)];return{q:'哪一個跟其他三個不一樣？',a:s[3],o:s,h:'看看三個是不是同一類。'}}},
order:{t:'📏 排排隊',e:'🐻🐰⭐',q(){let a=r(1,3),b=r(a+1,6);return{q:`小熊有 ${a} 顆球，小兔有 ${b} 顆球。誰比較多？`,a:'小兔',o:['小熊','小兔'],h:'比較兩個數字，哪個比較大？'}}},
shape:{t:'🔺 形狀偵探',e:'🔺🔵⬜',q(){let s=['圓形','三角形','正方形'][r(0,2)];return{q:`${s} 有幾個角？`,a:s==='圓形'?0:s==='三角形'?3:4,o:[0,3,4],h:'數一數形狀的角角。'}}},
position:{t:'🐧 位置小偵探',e:'🐧🐰⬆️',q(){let o=['上面','下面','旁邊'],a=o[r(0,2)];return{q:`小企鵝站在小兔子的 ${a}。請問小企鵝在哪裡？`,a,o,h:'仔細聽是哪一個位置。'}}},
pattern:{t:'🌈 規律接龍',e:'🌈⭐🌈',q(){let a=r(1,3),b=a+1;return{q:`看規律：${a}、${b}、${a}、${b}、？`,a,o:[a,b,a+2],h:'兩個數字一直輪流出現。'}}},
share:{t:'🍓 公平分一分',e:'🍓🍓🐧',q(){let p=r(2,3),e=r(1,3),t=p*e;return{q:`有 ${t} 顆草莓，平均分給 ${p} 個小朋友，每人幾顆？`,a:e,h:`想一想：${e} × ${p} = ${t}。`}}},
count:{t:'🔢 數一數',e:'⭐🐧⭐',q(){let n=r(2,7),it=['🐰','⭐','🍎','🐧','🧸'][r(0,4)];return{q:`請數一數：${it.repeat(n)} 一共有幾個？`,a:n,h:'慢慢一個一個數。'}}},
neighbor:{t:'🏠 數字鄰居',e:'🏠🔢⭐',q(){let n=r(2,5),w=Math.random()<.5?'前面':'後面';return{q:`數字 ${n} 的${w}一個數字是？`,a:w==='前面'?n-1:n+1,h:`從 ${n} 往${w}數一格。`}}},
oneMore:{t:'➕ 多一個少一個',e:'⭐➕⭐',q(){let n=r(1,6),m=Math.random()<.5;return{q:`現在有 ${n} 顆星星，${m?'多 1 顆':'少 1 顆'}，變成幾顆？`,a:m?n+1:n-1,h:m?`從 ${n} 再數 1 個。`:`從 ${n} 往回數 1 個。`}}},
long:{t:'📐 誰比較長？',e:'📏✏️🧸',q(){let a=['鉛筆','橡皮擦','尺'][r(0,2)];return{q:`媽媽說：${a} 通常比較長。你覺得對嗎？`,a:'對',o:['對','不對'],h:'想像把三樣東西排在一起比較。'}}},
match:{t:'🧩 找一樣的',e:'🧩🐰⭐',q(){let p=[['🐰','🐰','🐧'],['⭐','🍎','⭐'],['🧸','🧸','🍓'],['🐶','🐱','🐶']][r(0,3)];return{q:`哪一個圖案跟第一個 ${p[0]} 一樣？`,a:p[0],o:[p[1],p[2]],h:'看清楚圖案的樣子。'}}},
odd:{t:'👀 找出不一樣',e:'👀🍎🍌',q(){let s=[['🍎','🍎','🍎','🍌'],['🐰','🐰','🐱','🐰'],['⭐','🌟','⭐','⭐'],['🟢','🟢','🔵','🟢']][r(0,3)];return{q:`找一找：${s.join(' ')}，哪一個不一樣？`,a:s[2],o:[...new Set(s)],h:'慢慢看每一個，找出偷偷變掉的那個。'}}}
};
const names=Object.keys(G), $=id=>document.getElementById(id), r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let today=new Date().toISOString().slice(0,10),state=JSON.parse(localStorage.getItem('xuanMathOfficial')||'null');if(!state||state.date!==today)state={date:today,done:0,stars:0};let type='add',cur=null,answered=false,daily=false,queue=[],qi=0;
function save(){localStorage.setItem('xuanMathOfficial',JSON.stringify(state))}function update(){ $('stars').textContent=state.stars;$('done').textContent=state.done+' / 5';$('bar').style.width=Math.min(100,state.done/5*100)+'%';$('homeStarsValue').textContent=state.stars;$('homeDoneValue').textContent=state.done+' / 5';$('homeMiniStars').textContent='★★★★★'.slice(0,state.done)+'☆☆☆☆☆'.slice(0,5-state.done)}
function options(ans,o){if(o)return [...new Set(o)];if(typeof ans!=='number')return[ans];let s=new Set([ans]);while(s.size<4)s.add(Math.max(0,ans+r(-2,2)));return [...s].sort((a,b)=>a-b)}
function openGame(t){type=t;answered=false;$('homePage').classList.add('hidden');$('gamePage').classList.remove('hidden');$('gameTitle').textContent=G[t].t.replace(/^\S+\s/,'');newQ();scrollTo({top:0,behavior:'smooth'})}
function newQ(){answered=false;let x=G[type].q();cur=x;$('sceneEmoji').textContent=G[type].e;$('speech').textContent='企鵝妹：'+['我們一起想想看！🐧','慢慢來，瑄一定可以！🌸','看看圖案，再想一下喔！⭐'][r(0,2)];$('question').textContent=x.q;$('feedback').innerHTML='';$('answers').innerHTML='';options(x.a,x.o).forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>check(v,b);$('answers').appendChild(b)});$('next').textContent='下一題';}
function check(v,b){if(answered)return;let ok=String(v)===String(cur.a);if(ok){answered=true;state.done++;state.stars++;save();b.classList.add('ok');$('feedback').innerHTML='答對了！🌟 瑄好棒！<small>這顆星星是妳自己努力拿到的喔！</small>';burst();update();if(daily&&qi>=4)setTimeout(finish,600)}else{b.classList.add('no');$('feedback').innerHTML='沒關係～再想一下 💗<small>提示按鈕可以幫妳找線索！</small>'}}
function burst(){for(let i=0;i<9;i++){let s=document.createElement('span');s.className='fly';s.textContent=i%3?'⭐':'🌟';s.style.left=(20+Math.random()*60)+'%';s.style.top=(40+Math.random()*25)+'%';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-100-Math.random()*180)+'px');$('fx').appendChild(s);setTimeout(()=>s.remove(),1000)}}
$('hint').onclick=()=>{$('feedback').innerHTML='💡 '+cur.h};$('speak').onclick=()=>{if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(cur.q);u.lang='zh-TW';speechSynthesis.cancel();speechSynthesis.speak(u)}};
$('next').onclick=()=>{if(!answered){$('feedback').innerHTML='先選一個答案喔～💗';return}if(daily){qi++;if(qi<5){type=queue[qi];newQ()}else finish()}else newQ()};
function finish(){daily=false;$('reward').classList.add('show')}$('daily').onclick=()=>{daily=true;qi=0;queue=[...names].sort(()=>Math.random()-.5).slice(0,5);openGame(queue[0])};$('back').onclick=goHome;$('heroBack').onclick=goHome;$('rewardClose').onclick=()=>{$('reward').classList.remove('show');goHome()};$('danceBtn').onclick=()=>{$('rewardMsg').textContent='🐧 咚咚咚～小企鵝開始跳舞啦！'};$('stickerBtn').onclick=()=>{$('rewardMsg').textContent='🎀 瑄今天獲得一張小貼紙！🌸🐧⭐'};
function goHome(){$('reward').classList.remove('show');$('gamePage').classList.add('hidden');$('homePage').classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav==='home'));update();scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.hot[data-game]').forEach(b=>b.onclick=()=>{daily=false;openGame(b.dataset.game)});
const modal=$('modal'),mt=$('modalTitle'),mb=$('modalBody');function openModal(t,body){mt.textContent=t;mb.innerHTML=body;modal.classList.add('show')}$('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===n));if(n.dataset.nav==='home')goHome();if(n.dataset.nav==='stars')openModal('⭐ 我的星星',`<div style="text-align:center;padding:15px"><div style="font-size:60px">⭐</div><div style="font-size:36px;font-weight:1000;color:#b94d78">${state.stars} 顆</div><div class="line"><span>今天得到</span><span>${state.stars} 顆</span></div><p class="tiny">每答對一題，就幫瑄收集一顆星星！💗</p></div>`);if(n.dataset.nav==='records')openModal('📖 遊戲記錄',`<div class="line"><span>📅 今天</span><span>${state.done} 題　⭐ ${state.stars}</span></div><p class="tiny">每天的小進步，都幫瑄記下來喔！🌸</p>`);if(n.dataset.nav==='settings')openModal('⚙️ 遊戲設定',`<div class="line"><span>🔊 題目語音</span><span>可使用「聽題」</span></div><div class="line"><span>✨ 答對動畫</span><span>開啟</span></div><button class="backHome" id="reset">↻ 重新開始今天的 5 題</button>`);setTimeout(()=>{$('reset')?.addEventListener('click',()=>{if(confirm('要重新開始今天的 5 題嗎？今天的星星會歸零喔。')){state.done=0;state.stars=0;save();update();modal.classList.remove('show')}})},0)});
update();
</script>
</body></html>
