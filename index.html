<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffdce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>企鵝妹的數學遊戲｜V4.4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f8dce8;color:#70432c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.app{width:100%;max-width:832px;margin:auto;min-height:100vh;background:#fff5f9}
.homeVisual{position:relative;width:100%;aspect-ratio:832/1664;background:#ffdce8;overflow:hidden;touch-action:manipulation}
.homeImage{position:absolute;inset:0;background:url("xuan-home-v3.webp") center top/100% 100% no-repeat}

/* 主視覺上的透明互動區：左上設定、隨機出題、18 個遊戲 */
.settingsHot,.randomHot{position:absolute;top:1.0%;height:7.2%;z-index:10;background:transparent;border:0;border-radius:18px}
.settingsHot{left:2.0%;width:11.5%}
.randomHot{left:15.0%;width:12.5%}
.settingsHot:active,.randomHot:active{background:rgba(255,255,255,.18);transform:scale(.97)}

.hotspotGrid{
 position:absolute;left:2.0%;right:2.0%;top:25.4%;height:71.0%;
 display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);
 gap:0.8% 1.4%;z-index:5
}
.hot{border:0;background:transparent;border-radius:18px;min-width:0;min-height:0}
.hot:active{background:rgba(255,255,255,.16);transform:scale(.985)}

.gamePage{display:none;min-height:100vh;background:linear-gradient(#fff5f9,#f8eaff)}
.gameTop{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 12px;background:#fff8fcf2;backdrop-filter:blur(8px);border-bottom:2px solid #f2d4e2}
.backTop,.settingsTop{border:0;border-radius:15px;background:#fff;padding:10px 12px;color:#9d5075;font-weight:1000;box-shadow:0 4px 12px #7d4f6422}
.gameTitle{text-align:center;font-weight:1000;color:#b84e7b;font-size:18px}
.gameScore{background:#fff0b9;border-radius:15px;padding:9px 10px;font-weight:1000;color:#8a4b16}
.questionArea{padding:12px 14px 28px}
.scene{background:#fffafc;border:4px solid #fff;border-radius:30px;padding:14px;box-shadow:0 10px 26px #865c7820;overflow:hidden}
.sceneTop{min-height:170px;border-radius:22px;background:linear-gradient(135deg,#ffe7f0,#e9f7ff);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sceneEmoji{font-size:66px;letter-spacing:8px;z-index:1}
.speech{text-align:center;color:#a24d75;font-size:16px;font-weight:1000;margin:10px 4px}
.question{font-size:25px;line-height:1.45;font-weight:1000;text-align:center;min-height:100px;display:flex;align-items:center;justify-content:center;padding:6px 4px;color:#6d452e}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ans{min-height:66px;border-radius:20px;background:linear-gradient(#fff,#fff0f6);border:3px solid #f5d6e5;color:#7a4d67;font-size:23px;font-weight:1000;box-shadow:0 5px 12px #805a7418}
.ans.ok{background:#e7faef;border-color:#8bd6a8}
.ans.no{background:#fff0f0;border-color:#efaaaa;animation:shake .25s}
.feedback{text-align:center;min-height:56px;padding:9px 4px 0;font-weight:1000;color:#b44f78;font-size:18px}
.feedback small{display:block;color:#916d80;font-size:13px;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.btn{border-radius:17px;padding:12px 5px;background:#f0e3f8;color:#684c70;font-weight:1000}
.primary{background:linear-gradient(135deg,#ff82ad,#c99bed);color:#fff}
.backHome{display:block;width:100%;margin-top:12px;background:#fff;border:2px solid #efd4e1;color:#9a5b7b;border-radius:17px;padding:12px;font-weight:1000}
.modal{display:none;position:fixed;inset:0;background:#5d415b66;z-index:50;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modalBox{width:min(440px,100%);max-height:82vh;overflow:auto;background:#fff8fc;border-radius:30px 30px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #4d334a33}
.modalHead{display:flex;justify-content:space-between;align-items:center;color:#bd4e7c;font-size:21px;font-weight:1000}
.close{width:38px;height:38px;border-radius:50%;background:#f1e4ed;color:#76536c;font-size:22px}
.line{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:2px dashed #f0cada;font-weight:900}
.tiny{color:#977486;font-size:12px;text-align:center;line-height:1.6}
.reward{display:none;position:fixed;inset:0;background:#fff2f8f2;z-index:60;align-items:center;justify-content:center;padding:20px}
.reward.show{display:flex}
.rewardBox{width:min(390px,100%);background:#fff;border:4px solid #ffd5e5;border-radius:30px;padding:22px;text-align:center;box-shadow:0 18px 50px #70486130}
.dance{font-size:64px;animation:dance .55s infinite alternate ease-in-out}
.starsFx{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.fly{position:absolute;font-size:30px;animation:fly .9s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:scale(.3) translate(0,0)}20%{opacity:1}100%{opacity:0;transform:scale(1.3) translate(var(--x),var(--y))}}
@keyframes dance{from{transform:translateY(7px) rotate(-7deg)}to{transform:translateY(-8px) rotate(7deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
@media(max-width:600px){
 .app{max-width:none}
 .homeVisual{width:100%;min-height:100svh;height:auto}
 .hotspotGrid{top:25.4%;height:71.0%}
 .question{font-size:22px}
 .sceneTop{min-height:145px}
}

.audioRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:2px dashed #f0cada}
.toggle{position:relative;width:58px;height:32px;border-radius:20px;background:#d8cbd4;transition:.2s;flex:0 0 auto}
.toggle:after{content:"";position:absolute;width:26px;height:26px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0002;transition:.2s}
.toggle.on{background:linear-gradient(135deg,#ff83ad,#c99bed)}
.toggle.on:after{left:29px}
.audioLabel{font-weight:1000;color:#704b63}
.audioActions{display:flex;gap:8px;margin:10px 0 4px}
.soundTest{border:0;border-radius:14px;padding:10px 12px;background:#fff1f7;color:#7d4c67;font-weight:900;box-shadow:0 2px 8px #00000010;cursor:pointer}
.soundTest:active{transform:scale(.97)}
.musicTest{background:linear-gradient(135deg,#fff2b8,#ffd9ec)}
.audioStatus{font-size:12px;color:#9a7185;text-align:center;padding:8px 4px 12px}
.audioSub{font-size:12px;color:#a08393;margin-top:2px}
.musicSelect{width:100%;margin:8px 0 4px;padding:11px 12px;border:2px solid #f0cada;border-radius:15px;background:#fff;color:#704b63;font-weight:900;font-size:15px;outline:none}
.musicSelect:focus{border-color:#d89abd;box-shadow:0 0 0 3px #f5d9e955}
.musicName{font-size:12px;color:#a08393;margin:2px 0 8px}
</style>
</head>
<body>
<div class="app">
<section class="homeVisual" id="homePage">
  <div class="homeImage" aria-label="企鵝妹的數學遊戲主視覺"></div>
  <button class="settingsHot" aria-label="設定" onclick="openSettings()"></button>
  <button class="randomHot" aria-label="隨機出題" onclick="randomGame()"></button>
  <div class="hotspotGrid" id="hotspotGrid"></div>
</section>

<section class="gamePage" id="gamePage">
  <div class="gameTop">
    <button class="backTop" onclick="goHome()">← 回首頁</button>
    <div class="gameTitle" id="gameTitle">數學遊戲</div>
    <div class="gameScore">⭐ <span id="gameScore">0</span></div>
  </div>
  <div class="questionArea">
    <div class="scene">
      <div class="sceneTop"><div class="sceneEmoji" id="sceneEmoji">🐰</div></div>
      <div class="speech" id="speech">瑄，我們一起想想看！</div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn" onclick="hint()">💡 提示</button>
        <button class="btn" onclick="speakQuestion()">🔊 聽題目</button>
        <button class="btn primary" onclick="nextQuestion()" id="nextBtn">下一題 →</button>
      </div>
      <button class="backHome" onclick="goHome()">🏠 回到首頁</button>
    </div>
  </div>
</section>
</div>

<div class="modal" id="settingsModal">
  <div class="modalBox">
    <div class="modalHead"><span>⚙️ 設定</span><button class="close" onclick="closeSettings()">×</button></div>
    <div class="line"><span>每日目標</span><strong>5 題</strong></div>
    <div class="line"><span>目前星星</span><strong>⭐ <span id="settingsStars">0</span></strong></div>
    <div class="line"><span>今日完成</span><strong><span id="settingsDone">0</span> / 5</strong></div>
    <div class="audioRow">
      <div><div class="audioLabel">🎵 可愛背景配樂</div><div class="audioSub">輕柔、不吵鬧的兒童旋律</div></div>
      <button id="musicToggle" class="toggle on" aria-label="切換背景配樂" onclick="toggleMusic()"></button>
    </div>
    <div class="audioActions">
      <button class="soundTest musicTest" onclick="playMusicNow()">▶ 立即播放配樂</button>
      <button class="soundTest" onclick="testSfx()">🔔 試聽音效</button>
    </div>
     <div class="audioSub">🎼 選一首喜歡的背景音樂</div>
     <select id="musicSelect" class="musicSelect" onchange="changeMusic(this.value)">
       <option value="bunny">🐰 小兔子散步曲</option>
       <option value="penguin">🐧 企鵝跳跳曲</option>
       <option value="rainbow">🌈 彩虹泡泡曲</option>
       <option value="star">⭐ 星星夢幻曲</option>
       <option value="garden">🌷 花園散步曲</option>
     </select>
     <div class="musicName" id="musicName">目前：🐰 小兔子散步曲</div>
    <div class="audioRow">
      <div><div class="audioLabel">🔔 遊戲音效</div><div class="audioSub">答對、答錯、按鈕與完成獎勵音效</div></div>
      <button id="sfxToggle" class="toggle on" aria-label="切換遊戲音效" onclick="toggleSfx()"></button>
    </div>
    <div class="audioStatus" id="audioStatus">🎵 點「立即播放配樂」即可開始聽音樂</div>
    <p class="tiny">主畫面只保留「設定」與「隨機出題」；18 張遊戲情境插畫都可以直接點擊開始。</p>
    <button class="backHome" onclick="closeSettings()">完成</button>
  </div>
</div>

<div class="reward" id="reward">
  <div class="rewardBox">
    <div class="dance">🐧 🎀 🐧</div>
    <h2>太棒了！🎉</h2>
    <p>瑄完成今天的 5 題數學遊戲！</p>
    <button class="btn primary" onclick="closeReward()">收下獎勵 ⭐</button>
  </div>
</div>
<div class="starsFx" id="starsFx"></div>

<script>
const games=[
['動物加加樂','🐧 🦒 🐰','一起數一數'],
['誰比較多？','🍓 🐰 🧺','比一比誰更多'],
['小兔子跑掉了','🐰 🐰 🏃','減法小挑戰'],
['神秘數字','🔎 ❓ 💡','找出神秘數字'],
['數字接龍','🚂 1 2 3 ❓','下一個數字'],
['媽媽說錯了！','👧 🐧 ❓','判斷對不對'],
['水果分類','🍎 🍌 🍇','分一分'],
['排排隊','🐘 🧸 🐰','誰在前面'],
['形狀小偵探','🔺 🔵 ⭐','找形狀'],
['位置小高手','📦 🧸 🚗','上面下面裡面'],
['規律接龍','⭐ ❤️ ⭐ ❓','找規律'],
['公平分一分','🐰 🍪 🐧','平均分配'],
['數一數','🐧 🐟 🎣','數量是多少'],
['數字鄰居','🏠 3 4 5','前後鄰居'],
['多一個少一個','🎈 3 → ❓','多一個少一個'],
['長短比一比','🦒 📏 🐰','長短比較'],
['找一樣的','🔍 🌸 🌸','找相同'],
['找出不一樣','🌷 🌷 🌼','找不同']
];

let state=JSON.parse(localStorage.getItem('xuanV3State')||'{}');
state.stars=state.stars||0;
state.today=state.today||new Date().toISOString().slice(0,10);
state.done=state.done||0;
state.history=state.history||[];
if(state.today!==new Date().toISOString().slice(0,10)){
  state.today=new Date().toISOString().slice(0,10);state.done=0;save();
}

let current=0,q=0,answered=false,currentQ=null;

// ===== 兒童 App 可愛音樂 / 音效（Web Audio，不需另外上傳音檔） =====
let audioCtx=null, musicTimer=null, musicStep=0;
let musicOn=state.musicOn!==false;
let sfxOn=state.sfxOn!==false;

const melodies={
  bunny:{lead:[72,76,79,76,74,77,81,77,72,76,79,83,79,76,74,72],bass:[48,48,53,53,45,45,50,50],chord:[[60,64,67],[65,69,72],[57,60,64],[62,65,69]]},
  penguin:{lead:[76,79,81,79,76,74,76,79,84,81,79,76,74,72,74,76],bass:[48,48,55,55,43,43,50,50],chord:[[60,64,67],[67,71,74],[55,59,62],[62,65,69]]},
  rainbow:{lead:[84,81,79,81,84,88,86,84,81,79,76,79,81,84,81,79],bass:[48,48,45,45,53,53,50,50],chord:[[60,64,67],[57,60,64],[65,69,72],[62,65,69]]},
  star:{lead:[72,74,77,79,84,79,77,74,72,76,79,81,84,81,79,76],bass:[45,45,50,50,48,48,43,43],chord:[[57,60,64],[62,65,69],[60,64,67],[55,59,62]]},
  garden:{lead:[76,76,79,81,79,76,74,76,79,81,84,81,79,76,74,72],bass:[48,48,53,53,45,45,50,50],chord:[[60,64,67],[65,69,72],[57,60,64],[62,65,69]]}
};
const musicNames={
  bunny:'🐰 小兔子散步曲',
  penguin:'🐧 企鵝跳跳曲',
  rainbow:'🌈 彩虹泡泡曲',
  star:'⭐ 星星夢幻曲',
  garden:'🌷 花園散步曲'
};
let selectedMusic=state.selectedMusic||'bunny';
const noteHz=n=>440*Math.pow(2,(n-69)/12);

async function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    audioCtx=new AC();
  }
  if(audioCtx.state==='suspended'){
    try{ await audioCtx.resume(); }catch(e){}
  }
  return audioCtx;
}
function tone(freq,dur=.16,vol=.045,type='sine',delay=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  const t=audioCtx.currentTime+delay;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.018);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+dur+.03);
}
function sfx(kind){
  if(!sfxOn)return;
  ensureAudio();
  if(!audioCtx)return;
  if(kind==='tap') tone(noteHz(84),.055,.018,'sine');
  if(kind==='correct'){
    tone(noteHz(76),.10,.045,'sine',0);
    tone(noteHz(81),.12,.045,'sine',.08);
    tone(noteHz(84),.18,.05,'triangle',.17);
  }
  if(kind==='wrong'){
    tone(noteHz(67),.12,.028,'sine',0);
    tone(noteHz(64),.18,.022,'sine',.11);
  }
  if(kind==='reward'){
    [72,76,79,84,88].forEach((n,i)=>tone(noteHz(n),.18,.045,'triangle',i*.09));
  }
}
async function startMusic(){
  if(!musicOn || musicTimer)return;
  const ctx=await ensureAudio();
  if(!ctx || ctx.state!=='running')return;
  musicStep=0;
  const music=melodies[selectedMusic]||melodies.bunny;
  musicTimer=setInterval(()=>{
    if(!musicOn){stopMusic();return}
    const i=musicStep%music.lead.length;
    const n=music.lead[i];
    // 主旋律：較柔和的三角波
    tone(noteHz(n),.30,.030,'triangle');
    // 和弦：每兩拍換一次，讓音樂不再只有單音
    if(musicStep%2===0){
      const chord=music.chord[Math.floor(musicStep/2)%music.chord.length];
      chord.forEach((cn,j)=>tone(noteHz(cn),.78,.010,'sine',j*.018));
    }
    // 低音：提供溫暖的底
    if(musicStep%4===0){
      const bn=music.bass[Math.floor(musicStep/4)%music.bass.length];
      tone(noteHz(bn),.72,.020,'sine',.015);
    }
    // 輕柔節拍，增加遊戲感
    if(musicStep%2===1) tone(noteHz(48),.045,.008,'sine');
    musicStep++;
  },420);
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null}
}
async function toggleMusic(){
  musicOn=!musicOn;state.musicOn=musicOn;save();
  const el=$('musicToggle'); if(el)el.classList.toggle('on',musicOn);
  if(musicOn){
    await ensureAudio(); await startMusic();
    setAudioStatus('🎵 背景配樂已開啟');
    sfx('tap');
  }else{
    stopMusic();
    setAudioStatus('🔇 背景配樂已關閉');
  }
}
async function toggleSfx(){
  sfxOn=!sfxOn;state.sfxOn=sfxOn;save();
  const el=$('sfxToggle'); if(el)el.classList.toggle('on',sfxOn);
  if(sfxOn){
    await ensureAudio();
    setAudioStatus('🔔 遊戲音效已開啟');
    sfx('tap');
  }else{
    setAudioStatus('🔕 遊戲音效已關閉');
  }
}
async function changeMusic(name){
  if(!melodies[name])return;
  selectedMusic=name;
  state.selectedMusic=name;
  save();
  const sel=$('musicSelect');
  if(sel)sel.value=name;
  const label=$('musicName');
  if(label)label.textContent='目前：'+musicNames[name];
  if(musicOn){
    stopMusic();
    await ensureAudio();
    await startMusic();
    setAudioStatus('🎵 已切換：'+musicNames[name]);
  }else{
    setAudioStatus('🎼 已選擇：'+musicNames[name]);
  }
}

async function playMusicNow(){
  musicOn=true;state.musicOn=true;save();syncAudioUI();
  await ensureAudio();
  await startMusic();
  setAudioStatus(musicTimer ? '🎵 正在播放可愛配樂' : '⚠️ 瀏覽器尚未啟用音訊，請再點一次');
}
async function testSfx(){
  sfxOn=true;state.sfxOn=true;save();syncAudioUI();
  await ensureAudio();
  sfx('correct');
  setAudioStatus('🔔 音效播放中！');
}
function setAudioStatus(text){
  const el=$('audioStatus'); if(el)el.textContent=text;
}
function syncAudioUI(){
  const m=$('musicToggle'),x=$('sfxToggle');
  if(m)m.classList.toggle('on',musicOn);
  if(x)x.classList.toggle('on',sfxOn);
}
// 第一次觸碰畫面時才啟動，符合 iPhone 瀏覽器的音訊規則
document.addEventListener('pointerdown',async()=>{
  await ensureAudio();
  if(musicOn && !musicTimer) await startMusic();
},{once:true});

const $=id=>document.getElementById(id);
function save(){localStorage.setItem('xuanV3State',JSON.stringify(state))}
function renderHome(){
  const g=$('hotspotGrid');g.innerHTML='';
  games.forEach((x,i)=>{
    const b=document.createElement('button');
    b.className='hot';b.setAttribute('aria-label',x[0]);
    b.onclick=()=>{sfx('tap');startGame(i)};
    g.appendChild(b);
  });
}
function goHome(){
  sfx('tap');
  $('homePage').style.display='block';
  $('gamePage').style.display='none';
  window.scrollTo(0,0);
}
function startGame(i){
  current=i;q=0;answered=false;
  $('homePage').style.display='none';
  $('gamePage').style.display='block';
  $('gameTitle').textContent=games[i][0];
  newQuestion();window.scrollTo(0,0);
}
function randomGame(){sfx('tap');startGame(Math.floor(Math.random()*games.length))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(ans,min,max){
  let s=new Set([String(ans)]);
  while(s.size<4)s.add(String(rand(min,max)));
  return [...s].sort(()=>Math.random()-.5);
}
function makeQuestion(i){
  let a,b,ans,choices,text,hintText;
  if(i===0){a=rand(1,4);b=rand(1,4);ans=a+b;text=`有 ${a} 隻小動物，又來了 ${b} 隻，一共有幾隻？`;choices=pick(ans,1,8);hintText='可以用手指頭一起數喔！'}
  else if(i===1){a=rand(1,6);b=rand(1,6);ans=a>b?'A':a<b?'B':'平手';text=`左邊有 ${a} 個，右邊有 ${b} 個，哪一邊比較多？`;choices=['A','B','平手'];hintText='先數一數兩邊各有幾個。'}
  else if(i===2){a=rand(3,7);b=rand(1,a-1);ans=a-b;text=`有 ${a} 隻小兔子，跑走 ${b} 隻，還剩下幾隻？`;choices=pick(ans,1,7);hintText=`從 ${a} 開始，一隻一隻倒數 ${b} 次。`}
  else if(i===3){a=rand(1,7);ans=a+1;text=`神秘數字比 ${a} 大 1，它是？`;choices=pick(ans,1,9);hintText='先找到比提示數字大 1 的數。'}
  else if(i===4){a=rand(1,4);ans=a+3;text=`數字排成 ${a}、${a+1}、${a+2}，下一個是？`;choices=pick(ans,1,9);hintText='每次都多 1。'}
  else if(i===5){a=rand(1,4);b=rand(1,4);let shown=a+b+1;text=`媽媽說：${a} + ${b} = ${shown}，媽媽說對不對？`;choices=['對','不對'];ans=(a+b===shown)?'對':'不對';hintText='把兩個數字真的算一次。'}
  else if(i===6){const arr=['蘋果','香蕉','葡萄'];ans=arr[rand(0,2)];text=`哪一個是水果？ ${ans}、小汽車、積木`;choices=[ans,'小汽車','積木'];hintText='想想看哪些東西可以吃。'}
  else if(i===7){text='小熊排在小兔子前面，小象排在小熊前面，誰站在最前面？';choices=['小兔子','小熊','小象'];ans='小象';hintText='想像三個小動物排成一列。'}
  else if(i===8){const shapes=['三角形','圓形','星形'];ans=shapes[rand(0,2)];text=`哪一個是${ans}？`;choices=shapes;hintText='看看每個形狀的外框。'}
  else if(i===9){const places=['上面','下面','裡面'];ans=places[rand(0,2)];text=`小熊在箱子的${ans}，哪個答案正確？`;choices=places;hintText='想像小熊和箱子的相對位置。'}
  else if(i===10){ans='愛心';text='⭐ ❤️ ⭐ ❤️ 下一個應該是什麼？';choices=['⭐','❤️','🐰','🐧'];hintText='看看星星和愛心是不是輪流出現。'}
  else if(i===11){a=rand(2,4);ans=a;text=`有 ${a*2} 塊餅乾，要公平分給 2 隻小動物，每隻幾塊？`;choices=pick(ans,1,5);hintText='把餅乾一樣一樣分給兩隻。'}
  else if(i===12){a=rand(2,6);ans=a;text=`請數一數：畫面裡有 ${a} 隻小企鵝。共有幾隻？`;choices=pick(ans,1,7);hintText='慢慢數，不要漏掉喔！'}
  else if(i===13){a=rand(2,7);ans=`${a-1} 和 ${a+1}`;text=`數字 ${a} 的鄰居是哪些？`;choices=[`${a-1} 和 ${a+1}`,`${a-2} 和 ${a+2}`,`${a} 和 ${a+1}`];hintText='想想看，前一個和後一個數字。'}
  else if(i===14){a=rand(1,6);ans=a+1;text=`${a} 多一個是多少？`;choices=pick(ans,1,8);hintText=`在 ${a} 後面數一個。`}
  else if(i===15){ans='長頸鹿';text='長頸鹿和小兔子比一比，誰比較長？';choices=['長頸鹿','小兔子'];hintText='想想看誰的身體比較高長。'}
  else if(i===16){ans='🌸';text='找一樣的：🌸  🌼  🌸，哪一個和第一個一樣？';choices=['🌸','🌼','🐰'];hintText='看花朵的形狀。'}
  else{ans='第 3 個';text='找出不一樣：🌷  🌷  🌼  🌷，哪一個不一樣？';choices=['第 1 個','第 2 個','第 3 個','第 4 個'];hintText='仔細看看哪一朵花不一樣。'}
  return {text,choices,ans,hintText};
}
function newQuestion(){
  answered=false;currentQ=makeQuestion(current);
  $('sceneEmoji').textContent=games[current][1];
  $('question').textContent=currentQ.text;
  $('feedback').innerHTML='';
  $('nextBtn').textContent='下一題 →';
  const box=$('answers');box.innerHTML='';
  currentQ.choices.forEach(c=>{
    const b=document.createElement('button');b.className='ans';b.textContent=c;
    b.onclick=()=>answer(c,b);box.appendChild(b);
  });
  $('gameScore').textContent=state.stars;
}
function answer(c,btn){
  if(answered)return;
  ensureAudio();
  const ok=String(c)===String(currentQ.ans);
  if(ok){
    answered=true;
    sfx('correct');btn.classList.add('ok');state.stars++;state.done=Math.min(5,state.done+1);save();
    $('gameScore').textContent=state.stars;
    $('feedback').innerHTML='答對了！⭐ 太棒了！<small>瑄真的有認真想耶！</small>';
    stars();
    if(state.done===5)setTimeout(()=>{$('reward').classList.add('show');sfx('reward')},650);
  }else{
    sfx('wrong');
    btn.classList.add('no');
    $('feedback').innerHTML='沒關係，再想一下 💕<small>'+currentQ.hintText+'</small>';
  }
}
function nextQuestion(){
  sfx('tap');
  if(!answered){$('feedback').innerHTML='先選一個答案試試看喔！💗';return}
  q++;if(q>=5)q=0;newQuestion();
}
function hint(){sfx('tap');$('feedback').innerHTML='💡 '+currentQ.hintText}
function speakQuestion(){
  sfx('tap');
  if('speechSynthesis'in window){
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(currentQ.text);
    u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u);
  }
}
function stars(){
  const f=$('starsFx');
  for(let i=0;i<12;i++){
    const s=document.createElement('div');s.className='fly';s.textContent='⭐';
    s.style.left=(35+Math.random()*30)+'%';s.style.top=(45+Math.random()*20)+'%';
    s.style.setProperty('--x',(Math.random()*220-110)+'px');
    s.style.setProperty('--y',(-80-Math.random()*180)+'px');
    f.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}
function openSettings(){
  sfx('tap');
  syncAudioUI();
  const sel=$('musicSelect');
  if(sel)sel.value=selectedMusic;
  const label=$('musicName');
  if(label)label.textContent='目前：'+musicNames[selectedMusic];
  $('settingsStars').textContent=state.stars;
  $('settingsDone').textContent=state.done;
  setAudioStatus(musicOn ? (musicTimer ? '🎵 正在播放：'+musicNames[selectedMusic] : '🎵 配樂已開啟，點「立即播放配樂」即可聽') : '🔇 背景配樂目前關閉');
  $('settingsModal').classList.add('show');
}
function closeSettings(){sfx('tap');$('settingsModal').classList.remove('show')}
function closeReward(){sfx('tap');$('reward').classList.remove('show')}
renderHome();
</script>
