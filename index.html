<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd5e5">
<title>宥瑄的數學遊戲</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f9dce7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#70432c}
button{font:inherit}
.app{width:100%;max-width:440px;margin:auto;min-height:100vh}
.home{position:relative;width:100%;aspect-ratio:853/1844;background:url("xuan-home.webp") center top/100% 100% no-repeat;overflow:hidden}
.tap{position:absolute;border:0;background:transparent;cursor:pointer}
.card1{left:3%;top:41.0%;width:47%;height:15.3%}
.card2{left:50%;top:41.0%;width:47%;height:15.3%}
.card3{left:3%;top:56.8%;width:47%;height:14.7%}
.card4{left:50%;top:56.8%;width:47%;height:14.7%}
.card5{left:3%;top:72.0%;width:47%;height:14.6%}
.card6{left:50%;top:72.0%;width:47%;height:14.6%}
.navhome{left:0;bottom:0;width:24%;height:6.5%}
.statStars{position:absolute;left:9%;top:18.0%;width:22%;height:5.5%;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:#8a4b16;text-shadow:0 1px #fff}
.statDone{position:absolute;left:8%;top:25.7%;width:24%;height:5.7%;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:#74451f}
.overlayScreen{display:none;position:fixed;inset:0;background:linear-gradient(#fff6fa,#f4e8ff);z-index:20;overflow:auto}
.screen{max-width:440px;margin:auto;min-height:100vh;padding:14px 14px 30px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back,.mini{border:0;border-radius:14px;background:#fff;padding:9px 12px;box-shadow:0 4px 14px #8b63861c;font-weight:900;color:#714b69}
.title{font-weight:900;font-size:18px}
.progress{height:12px;background:#fff;border-radius:999px;overflow:hidden;margin-bottom:14px;box-shadow:inset 0 1px 4px #87637d18}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff91b7,#c89cf0);transition:.3s}
.questionCard{background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 24px #8e628d20}
.miniMascot{font-size:58px;text-align:center}.q{font-size:23px;line-height:1.5;font-weight:900;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{border:0;border-radius:18px;padding:16px 8px;background:#fff0f5;color:#68465f;font-size:22px;font-weight:900;box-shadow:0 3px 8px #8e668d12}.ans.ok{background:#e7faef;outline:3px solid #8bd6a8}.ans.no{background:#fff0f0;outline:3px solid #f0a0a0}
.feedback{text-align:center;min-height:30px;margin:12px 0;font-weight:900}
.actions{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:15px;padding:12px 8px;background:#f0e2fa;color:#684c70;font-weight:900}.primary{background:linear-gradient(135deg,#ff8fb4,#d49bea);color:#fff}
.reward{display:none;text-align:center;background:#fff;border-radius:28px;padding:28px;box-shadow:0 10px 30px #8e628d25}.reward.show{display:block}.bigstars{font-size:38px;letter-spacing:3px}
</style>
</head>
<body>
<div class="app">
  <div class="home" id="home">
    <div class="statStars" id="homeStars">12 ⭐</div>
    <div class="statDone" id="homeDone">0 / 5 題</div>
    <button class="tap card1" aria-label="動物加加樂" data-game="add"></button>
    <button class="tap card2" aria-label="誰比較多" data-game="compare"></button>
    <button class="tap card3" aria-label="小兔子跑掉了" data-game="sub"></button>
    <button class="tap card4" aria-label="神秘數字" data-game="mystery"></button>
    <button class="tap card5" aria-label="數字接龍" data-game="sequence"></button>
    <button class="tap card6" aria-label="媽媽說錯了" data-game="wrong"></button>
  </div>
</div>

<div class="overlayScreen" id="gameScreen">
  <div class="screen">
    <div class="top"><button class="back" id="back">← 回首頁</button><div class="title" id="gameTitle">數學遊戲</div><button class="mini" id="score">⭐ 0</button></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="questionCard" id="questionCard">
      <div class="miniMascot">🐧💗</div>
      <div class="q" id="question"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions"><button class="btn" id="hint">💡 提示</button><button class="btn" id="speak">🔊 聽題目</button><button class="btn primary" id="next">下一題</button></div>
    </div>
    <div class="reward" id="reward"><div style="font-size:24px;font-weight:900">🎉 今天完成 5 題啦！</div><div class="bigstars">⭐⭐⭐⭐⭐</div><p>瑄今天很棒！可以選一個小小獎勵囉 🎁</p><button class="btn primary" id="rewardBack">回首頁</button></div>
  </div>
</div>

<script>
const G={
add:{title:"🐰 動物加加樂",make(){let a=r(1,3),b=r(1,3),c=r(0,2),ans=a+b+c;return {q:`瑄有 ${a} 隻小兔子，媽媽有 ${b} 隻企鵝，阿嬤有 ${c} 隻小貓，全部有幾隻？`,ans,h:`先算 ${a}+${b}，再把 ${c} 加進來。`}}},
compare:{title:"🐧 誰比較多？",make(){let a=r(1,5),b=r(1,5);while(a===b)b=r(1,5);let ans=a>b?"瑄":"媽媽";return {q:`瑄有 ${a} 顆糖果，媽媽有 ${b} 顆，誰比較多？`,ans,opts:["瑄","媽媽"],h:"看看哪一邊的數字比較大。"}}},
sub:{title:"🥕 小兔子跑掉了",make(){let a=r(3,6),b=r(1,a-1);return {q:`草地上有 ${a} 隻兔子，${b} 隻跑走了，還剩幾隻？`,ans:a-b,h:`想想看：${a} 減掉 ${b}。`}}},
mystery:{title:"🔮 神秘數字",make(){let a=r(1,5),b=r(1,3);return {q:`我心裡有一個數字，加上 ${b} 會變成 ${a+b}，原來是多少？`,ans:a,h:"可以從答案往回數喔！"}}},
sequence:{title:"🔢 數字接龍",make(){let a=r(1,4);return {q:`數字接龍：${a}、${a+1}、${a+2}、？`,ans:a+3,h:"一個一個往後數！"}}},
wrong:{title:"😝 媽媽說錯了！",make(){let a=r(1,4),b=r(1,3),correct=a+b,wrong=correct+(Math.random()<.5?-1:1);return {q:`媽媽說：${a} + ${b} = ${wrong}。媽媽說對嗎？`,ans:wrong===correct?"對":"錯",opts:["對","錯"],h:`其實 ${a}+${b} 是 ${correct} 喔！`}}}
};
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}
const today=new Date().toISOString().slice(0,10);
let state=JSON.parse(localStorage.getItem("xuanMathOfficial")||"null");
if(!state||state.date!==today)state={date:today,done:0,stars:0};
let type="add",cur=null,answered=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("xuanMathOfficial",JSON.stringify(state))}
function updateHome(){$("homeStars").textContent=state.stars+" ⭐";$("homeDone").textContent=state.done+" / 5 題"}
function opts(ans,custom){if(custom)return custom;if(typeof ans!=="number")return [ans];let s=new Set([ans]);while(s.size<4)s.add(Math.max(0,ans+r(-2,2)));return [...s].sort((a,b)=>a-b)}
function openGame(t){type=t;answered=false;$("home").style.display="none";$("gameScreen").style.display="block";$("reward").classList.remove("show");$("questionCard").style.display="block";newQ()}
function newQ(){answered=false;$("feedback").textContent="";cur=G[type].make();$("gameTitle").textContent=G[type].title;$("question").textContent=cur.q;$("answers").innerHTML="";opts(cur.ans,cur.opts).forEach(v=>{let b=document.createElement("button");b.className="ans";b.textContent=v;b.onclick=()=>check(v,b);$("answers").appendChild(b)});$("score").textContent="⭐ "+state.stars;$("bar").style.width=Math.min(100,state.done/5*100)+"%"}
function check(v,b){if(answered)return;let ok=String(v)===String(cur.ans);if(ok){answered=true;state.done++;state.stars++;b.classList.add("ok");$("feedback").textContent="答對了！⭐ 瑄好棒！";save();$("score").textContent="⭐ "+state.stars;$("bar").style.width=Math.min(100,state.done/5*100)+"%";updateHome();if(state.done>=5)setTimeout(()=>{$("questionCard").style.display="none";$("reward").classList.add("show")},450)}else{$("feedback").textContent="再想一下～💗 按提示看看";b.classList.add("no")}}
$("hint").onclick=()=>{$("feedback").textContent="💡 "+cur.h};
$("speak").onclick=()=>{if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance(cur.q);u.lang="zh-TW";speechSynthesis.cancel();speechSynthesis.speak(u)}};
$("next").onclick=()=>newQ();
$("back").onclick=()=>{$("gameScreen").style.display="none";$("home").style.display="block";updateHome()};
$("rewardBack").onclick=()=>{$("reward").classList.remove("show");$("questionCard").style.display="block";$("gameScreen").style.display="none";$("home").style.display="block";updateHome()};
document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>openGame(b.dataset.game));
updateHome();
</script>
</body>
</html>
